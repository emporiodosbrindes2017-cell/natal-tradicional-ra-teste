
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Empório dos Brindes - Natal Tradicional</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets_natal_tradicional.mind; autoStart: true; uiScanning: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="santaVideo"
        src="./assets/Papai_Noel_teste_transparente_01.webm"
        preload="auto"
        muted
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

     <a-video
  id="santaOverlay"
  src="#santaVideo"
 width="1.70"
height="0.96"
  position="0.00 0 0.01"
  visible="false"
  material="shader: flat; transparent: true; alphaTest: 0.01">
</a-video>

    </a-entity>

  </a-scene>

 <script>
  const video = document.querySelector("#santaVideo");
  const overlay = document.querySelector("#santaOverlay");

  const target = document.querySelector(
    "[mindar-image-target]"
  );

  let targetVisible = false;

  video.addEventListener("playing", () => {
    if (!targetVisible) return;

    if (video.requestVideoFrameCallback) {
      video.requestVideoFrameCallback(() => {
        if (targetVisible) {
          overlay.setAttribute("visible", true);
        }
      });
    } else {
      overlay.setAttribute("visible", true);
    }
  });

  target.addEventListener("targetFound", () => {
    targetVisible = true;
    overlay.setAttribute("visible", false);

    video.currentTime = 0;

    video.play().catch(error => {
      console.log("Erro ao iniciar vídeo:", error);
    });
  });

  target.addEventListener("targetLost", () => {
    targetVisible = false;

    overlay.setAttribute("visible", false);

    video.pause();
    video.currentTime = 0;
  });
</script>

</body>
</html>
